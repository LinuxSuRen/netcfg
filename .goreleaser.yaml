version: 2

# 显式声明，避免归档名依赖本地目录名（仓库改名后本地克隆目录可能仍是旧名）
project_name: net-tool

before:
  hooks:
    # dist/ is built by the release workflow before goreleaser runs
    - go mod tidy

builds:
  - id: net-tool
    main: .
    binary: net-tool
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.FullCommit}}

archives:
  - id: net-tool
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
